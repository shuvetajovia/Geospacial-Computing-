name: Refresh point acquisition
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: point-acquisition
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests numpy h5py
      - run: python scripts/acquire_points.py
        env:
          MOSDAC_USERNAME: ${{ secrets.MOSDAC_USERNAME }}
          MOSDAC_PASSWORD: ${{ secrets.MOSDAC_PASSWORD }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/point-snapshot.json
          git diff --cached --quiet || git commit -m "Refresh latest monitoring point records"
          git push origin HEAD:main
